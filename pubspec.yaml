name: guesthouse_app
description: "Aplikasi Reservasi Kamar Guest House Deluxe & VIIP berbasis Flutter"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # HTTP & API
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local Storage (auth token, preferences)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Date & Time
  intl: ^0.20.3

  # Form & Validation
  reactive_forms: ^17.0.1

  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.1

  # Excel Export
  excel: ^4.0.6

  # File picker / share
  path_provider: ^2.1.4
  share_plus: ^10.0.3

  # JWT decode (untuk parse token)
  dart_jsonwebtoken: ^2.14.1

  # Utils
  equatable: ^2.0.7
  uuid: ^4.5.1
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
